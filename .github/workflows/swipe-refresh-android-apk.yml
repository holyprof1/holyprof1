name: Swipe Refresh Android APK
on:
  push:
    branches: [swipe-refresh-android]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p swipe-refresh-android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeRefresh-Android-APK
          path: swipe-refresh-android/app/build/outputs/apk/debug/app-debug.apk
